spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
# SECURITY: do NOT commit real JWT secrets. Provide a test-only key via the
# JWT_SECRET env var when running the test profile. The value below is a
# throw-away Base64 placeholder used only if none is supplied.
app.jwt.secret=${JWT_SECRET:dGVzdC1vbmx5LWtleS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24tMzItYnl0ZXMh}
app.jwt.expiration=86400000
